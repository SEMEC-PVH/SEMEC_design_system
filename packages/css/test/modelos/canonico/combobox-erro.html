<div class="semec-form-field">
  <label for="escola-origem" class="semec-label">Escola de origem</label>
  <semec-combobox class="semec-combobox" empty-text="Nenhuma escola encontrada">
    <select id="escola-origem" name="origem" class="semec-field" aria-invalid="true" aria-describedby="escola-origem-error">
      <option value="a">EMEF A</option>

    </select>
  </semec-combobox>

</div>
