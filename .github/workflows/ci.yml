name: CI

# Cobre o checklist de PR do AGENTS.md/CONTRIBUTING.md:
# build:ds, typecheck, lint, build do site, deriva dos artefatos de agentes,
# changeset obrigatório por pacote publicado (@semec/ds, @semec/ds-tokens, @semec/ds-css),
# testes do kit, build e testes dos pacotes sem React, teste do plano de release,
# o gate de qualidade e a regressão visual (contêiner do Playwright).
# O workflow "Release" só roda depois que este termina verde no main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: changeset
    # O PR "Version Packages" (changeset-release/main) consome os changesets;
    # ele mexe em package.json/CHANGELOG sem changeset, por definição.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verificar changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Falha se o PR muda arquivos publicados do @semec/ds
          # ("changedFilePatterns" em .changeset/config.json: src/**, manifest.js,
          # tokens.css, skills/** etc.) sem um changeset correspondente.
          if ! npx changeset status --since="origin/${BASE_REF}"; then
            echo "::error title=Changeset ausente::Este PR altera arquivos publicados do @semec/ds sem changeset. Rode 'npm run changeset' e commite o arquivo em .changeset/. Se a mudança realmente não precisa de release, use 'npx changeset add --empty'."
            exit 1
          fi

      - name: Verificar changeset por pacote
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # O `changeset status` acima só falha quando não há NENHUM changeset. Este
          # passo exige um changeset para CADA pacote público mudado: um changeset do
          # @semec/ds não cobre mudança no @semec/ds-tokens ou no @semec/ds-css. Mudança
          # em packages/react/tokens.css ou packages/react/fonts/ conta também para o
          # @semec/ds-tokens, que é gerado a partir deles (scripts/release/checar-changesets.mjs).
          node scripts/release/checar-changesets.mjs --since="origin/${BASE_REF}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint docs
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck package
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Testes do @semec/ds (Vitest + Testing Library + axe, zod 3 e 4)
        run: npm test

      - name: Teste do plano de release e da checagem de changeset
        # scripts/release/plano.mjs decide o que o workflow Release publica.
        run: npm run test:release

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build package
        run: npm run build:ds

      - name: Verify dist exists
        run: test -f packages/react/dist/react/index.js

      - name: Instalar Chromium (paridade das receitas sem React)
        run: npx playwright install --with-deps chromium

      - name: Build dos pacotes sem React (@semec/ds-tokens, @semec/ds-css)
        # O ds-tokens lê packages/react/tokens.css e packages/react/fonts/; o ds-css
        # importa o ds-tokens, por isso vem depois.
        run: npm run build:pacotes

      - name: Testes dos pacotes sem React (@semec/ds-tokens, @semec/ds-css)
        # Inclui a paridade de estilo das classes .semec-* com os componentes React
        # (precisa do build:ds e do Chromium instalados acima).
        run: npm run test:pacotes

      - name: Build dos pacotes não altera arquivos versionados
        # Tudo que o build gera vai para dist/ (ignorado). Se um build reescrever um
        # arquivo commitado em packages/tokens ou packages/css, o commit está desatualizado.
        run: |
          if ! git --no-pager diff --exit-code --stat -- packages/tokens packages/css; then
            echo "::error title=Pacote desatualizado::O build de @semec/ds-tokens ou @semec/ds-css alterou arquivos versionados. Rode 'npm run build:pacotes' e commite o resultado."
            exit 1
          fi

      - name: Testes do dist (fronteira RSC + poda por módulo)
        # check-rsc: importa @semec/ds/react na camada react-server, com os módulos
        # "use client" trocados por client references. check-treeshake: falha se
        # `import { Button } from "@semec/ds/react"` passar do limite de bundle.
        run: npm run test:dist --workspace @semec/ds

      - name: Build docs (export estático)
        # Chama o workspace direto: o "build" da raiz repetiria o build:ds no prebuild.
        run: npm run build --workspace @semec/docs

      - name: Aviso "Não publicado" nas páginas do site (TST-15)
        # Com changesets pendentes, toda página exportada mostra o aviso; sem eles, nenhuma.
        run: npm run check:release-banner --workspace @semec/docs

      - name: Verificar deriva dos artefatos de agentes
        run: |
          # build:ds e o prebuild do site regeneram llms.txt, llms-full.txt,
          # manifest.json, components/*.md e skills/ em apps/docs/public a partir de
          # packages/react/manifest.js. Se algo mudou, o commit esqueceu de regenerar.
          # O carimbo de data ("generatedAt" e "> Gerado <data>") é determinístico
          # (último commit em packages/react), mas o commit que muda o pacote recebe
          # data nova depois que os artefatos foram gerados, e o checkout raso da CI
          # vê outra data; por isso essas duas linhas ficam fora da comparação.
          untracked=$(git ls-files --others --exclude-standard -- apps/docs/public)
          if ! git --no-pager diff --exit-code --stat \
               -I '"generatedAt":' -I '^> Gerado ' -- apps/docs/public || [ -n "$untracked" ]; then
            git --no-pager diff -I '"generatedAt":' -I '^> Gerado ' -- apps/docs/public | head -200
            [ -n "$untracked" ] && printf 'Arquivos novos não commitados:\n%s\n' "$untracked"
            echo "::error title=Artefatos desatualizados::apps/docs/public está desatualizado em relação a packages/react/manifest.js. Rode 'npm run build:ds' (ou 'npm run generate:llms') e commite apps/docs/public."
            exit 1
          fi

  visual:
    name: test:visual
    # Regressão visual (TST-B1): as baselines são do Linux, geradas nesta mesma
    # imagem. A tag acompanha a versão EXATA do @playwright/test no package.json;
    # o tests/visual/docker.mjs confere a revisão do Chromium e falha se divergir.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Regressão visual (build:ds + Playwright no contêiner)
        # O pretest:visual roda build:ds; dentro da imagem o docker.mjs chama o Playwright direto.
        run: npm run test:visual

      - name: Enviar diffs e relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-visual
          path: |
            tests/visual/.results
            tests/visual/.report
          retention-days: 14

  gate-browsers:
    name: gate (webkit/firefox)
    # Cobertura opcional (NAV-05): os checks com navegador do gate e o
    # comportamento da suíte visual em WebKit e Firefox (sem baselines: pixel de
    # fonte muda por motor). Não obrigatório: não entra nos checks exigidos da
    # branch protection e não reprova o PR enquanto a cobertura amadurece.
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Gate em WebKit e Firefox
        run: npm run gate:browsers

      - name: Comportamento da suíte visual em WebKit e Firefox
        run: npm run test:visual:browsers

  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Instalar Chromium (estados abertos do gate)
        run: npx playwright install --with-deps chromium

      - name: Run Quality and Regression Gate
        run: npm run gate
