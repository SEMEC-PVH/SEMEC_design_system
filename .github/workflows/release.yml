name: Release

# Fluxo Changesets (ver CONTRIBUTING.md, "Publicação e versionamento", e ADR-022):
# 1. PRs com mudança publicada trazem um arquivo em .changeset/ (a CI exige).
# 2. Um mantenedor versiona num PR: roda `npm run version-packages` localmente numa
#    branch `changeset-release/<versão>` e abre o PR com o bump, o CHANGELOG, o lockfile e os artefatos de IA
#    regenerados (o script roda changeset version, npm install --package-lock-only e
#    generate:llms na mesma passada).
#    Este workflow NÃO cria branch, commit nem PR: a organização bloqueia PR aberto por
#    workflow, e o push do PR de versão com PAT deu 403 (AUD-12, run 38615303248).
# 3. Depois que a CI fica verde num push ao main, este workflow só decide e publica,
#    olhando TODOS os pacotes públicos do workspace (@semec/ds, @semec/ds-tokens,
#    @semec/ds-css…; plano em scripts/release/plano.mjs, com teste unitário):
#    - changesets pendentes  → resume o plano (`changeset status`) e termina com sucesso;
#    - nenhum pendente e ao menos um pacote com a versão do package.json fora do npm →
#      publica (`changeset publish`, que pula o que já está no npm), confere cada
#      versão no registry, envia uma tag <nome>@<versão> e cria uma GitHub Release
#      por pacote publicado;
#    - nenhum pendente e tudo já publicado → não faz nada.
#    Pacote em 0.0.0 (novo, antes do PR de versão) nunca é publicado.
# Só roda a partir de CI verde: não há gatilho por push direto nem workflow_dispatch.
#
# Segurança:
# - workflow_run só é aceito para push no main deste repositório (nunca PR, nunca fork);
#   além disso, o commit precisa estar no histórico de origin/main.
# - Segredos não ficam no env do job: o npm ci roda sem nenhum token. NPM_TOKEN só entra
#   no passo de autenticação npm; GITHUB_TOKEN só nos passos de tag e de GitHub Release.
# - O checkout não persiste credencial; a credencial git é posta e retirada no passo da tag.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Só para o push da tag e a GitHub Release (GITHUB_TOKEN). Nenhum PR é criado.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O commit exato que a CI aprovou. Sem credencial persistida no .git/config:
          # o npm ci (scripts de terceiros) não deve ver token nenhum.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir que o commit é do main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::$HEAD_SHA não está no histórico de origin/main; release abortado."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Plano de release
        id: plan
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # Lógica em scripts/release/plano.mjs (teste: npm run test:release).
        # Percorre todos os pacotes públicos do workspace (packages/*), consulta
        # `npm view <nome>@<versão>` um a um (E404 = não publicado; outro erro aborta,
        # para nunca decidir publicar às cegas; 0.0.0 nunca publica) e escreve as
        # saídas mode (pending/publish/noop), count e publish ("<nome> <versão> <dir>"
        # por linha).
        run: node scripts/release/plano.mjs

      - name: Resumo dos changesets pendentes
        if: steps.plan.outputs.mode == 'pending'
        run: |
          {
            echo "### Changesets pendentes"
            echo ""
            echo '```'
            npx changeset status --verbose 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticar npm
        # O ~/.npmrc é escrito depois do npm ci, então só os passos seguintes o enxergam.
        if: steps.plan.outputs.mode == 'publish'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Secret NPM_TOKEN vazio ou ausente no repo."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          if ! who=$(npm whoami 2>&1); then
            echo "::error::Token presente mas npm whoami falhou. Verifique se o NPM_TOKEN é válido e tem publish em @semec."
            exit 1
          fi
          echo "- npm whoami: \`$who\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        if: steps.plan.outputs.mode == 'publish'
        run: |
          # O changeset publish cria uma tag anotada local por pacote publicado:
          # precisa de identidade git. Ele mesmo pula o que já está no npm.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release

      - name: Conferir versões no npm
        if: steps.plan.outputs.mode == 'publish'
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          # O registry pode levar alguns minutos para refletir a publicação
          # (na 3.1.0 passou de 60s). Espera até 5 min por pacote, sem cache.
          failed=0
          while read -r name version dir; do
            [ -n "$name" ] || continue
            published=""
            for attempt in $(seq 1 30); do
              published=$(npm view "${name}@${version}" version --prefer-online 2>/dev/null || true)
              [ "$published" = "$version" ] && break
              echo "tentativa $attempt: registry ainda sem ${name}@${version}; aguardando 10s"
              sleep 10
            done
            echo "- npm \`${name}\`: esperado \`$version\`, encontrado \`${published:-nada}\`" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$published" != "$version" ]; then
              echo "::error::${name}@${version} não apareceu no npm depois do publish."
              failed=1
            fi
          done <<< "$PUBLISH"
          exit "$failed"

      - name: Enviar tags
        # Tag não é bloqueada como PR: vai com o GITHUB_TOKEN (contents: write).
        # Uma tag "<nome>@<versão>" por pacote publicado. Os pacotes já estão no npm
        # neste ponto, então falha aqui é aviso, não erro: a tag pode ser enviada
        # depois à mão (ver CONTRIBUTING.md).
        if: steps.plan.outputs.mode == 'publish'
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          while read -r name version dir; do
            [ -n "$name" ] || continue
            tag="${name}@${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              git tag -a "$tag" -m "$tag" "$HEAD_SHA"
            fi
            if git push origin "refs/tags/${tag}"; then
              echo "- tag: \`$tag\` enviada" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Pacote publicado, mas o push da tag $tag falhou. Envie à mão: git tag -a '$tag' -m '$tag' $HEAD_SHA && git push origin 'refs/tags/$tag'"
              echo "- tag: \`$tag\` **não enviada** (ver aviso)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$PUBLISH"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Criar GitHub Releases
        # Também é aviso: o que importa (npm) já foi publicado e conferido.
        # Uma Release por pacote, com as notas da seção "## <versão>" do CHANGELOG dele.
        if: steps.plan.outputs.mode == 'publish'
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r name version dir; do
            [ -n "$name" ] || continue
            tag="${name}@${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::warning::Tag $tag não está no GitHub; GitHub Release não criada."
              continue
            fi
            notes="$RUNNER_TEMP/notes-$(printf '%s' "$name" | tr '@/' '__').md"
            if [ -f "$dir/CHANGELOG.md" ]; then
              awk -v v="## ${version}" '
                $0 == v { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' "$dir/CHANGELOG.md" > "$notes"
            else
              echo "Primeira versão de ${name}." > "$notes"
            fi
            if ! gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"; then
              echo "::warning::Pacote publicado, mas a GitHub Release de $tag não foi criada. Crie à mão em Releases."
            fi
          done <<< "$PUBLISH"

      - name: Limpar credenciais
        if: always()
        run: |
          rm -f "$HOME/.npmrc"
          git config --local --unset-all http.https://github.com/.extraheader || true
