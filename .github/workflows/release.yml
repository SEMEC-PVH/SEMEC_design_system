name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build:ds

      - name: Diagnóstico npm
        run: |
          {
            echo "## Release @semec/ds"
            echo ""
            echo "- version local: \`$(node -p "require('./packages/react/package.json').version")\`"
            echo "- npm whoami: \`$(npm whoami 2>&1 || echo '(não autenticado)')\`"
            echo "- NODE_AUTH_TOKEN set: \`${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}\`"
            echo ""
            echo "### Publish plan"
            echo '```'
            npx changeset publish-plan
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Secret NPM_TOKEN vazio ou ausente no repo."
            exit 1
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::Token presente mas npm whoami falhou. Verifique se o NPM_TOKEN é válido e tem publish em @semec."
            exit 1
          fi

      - name: Publish to npm
        run: npx changeset publish

      - name: Verify version on npm
        run: |
          expected=$(node -p "require('./packages/react/package.json').version")
          published=$(npm view @semec/ds version)
          echo "expected=$expected published=$published" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$published" != "$expected" ]; then
            echo "::error::@semec/ds no npm está em '$published', mas o repo espera '$expected'"
            exit 1
          fi
