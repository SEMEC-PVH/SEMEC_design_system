name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build:ds

      - name: Show publish plan
        run: |
          echo "package version: $(node -p "require('./packages/react/package.json').version")"
          echo "npm whoami: $(npm whoami 2>&1 || true)"
          npx changeset publish-plan

      - name: Publish to npm
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify version on npm
        run: |
          expected=$(node -p "require('./packages/react/package.json').version")
          published=$(npm view @semec/ds version)
          echo "expected=$expected published=$published"
          if [ "$published" != "$expected" ]; then
            echo "::error::@semec/ds no npm está em '$published', mas o repo espera '$expected'"
            exit 1
          fi
