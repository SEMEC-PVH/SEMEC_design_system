        - heading "SEMEC design system" [level=1] [ref=f2e370]
        - paragraph [ref=f2e371]: Atualizado em 25 de setembro de 2026
        - heading "O que é um Design System" [level=2] [ref=f2e372]
        - paragraph [ref=f2e373]: Um Design System é um conjunto de diretrizes, componentes reutilizáveis, padrões e recursos que ajudam designers e desenvolvedores a criar experiências digitais consistentes. O SEMEC Design System (SDS) reúne a linguagem visual e os padrões web da Prefeitura de Porto Velho em um só lugar.
        - paragraph [ref=f2e374]: Com o SDS, quem constrói interfaces institucionais parte de decisões já tomadas — tipografia, cor, espaçamento, componentes e padrões — e concentra o esforço no que é específico de cada aplicação. O resultado é uma experiência coerente, acessível e eficiente em todos os serviços.
